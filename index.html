<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Látványweboldal</title>
    <style>
        body {
            background-color: cadetblue;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 3em;
        }
        a {
            text-decoration: none;
        }
        p {
            display: inline-block;
            color: darkcyan;
            background-color: wheat;
            font-size: 3em;
            padding: 20px;
            border-radius: 20px;
            transition: all 1s;
        }
        p:hover {
            transform: scale(1.2);
        }
        .smile {
            position: relative;
            background-color: wheat;
            width: 100px;
            height: 100px;
            border-radius: 0 40px 0 0 ;
        }
        .eyes {
            position: absolute;
            color: black;
            font-size: 200px;
            top: -120px;
            left: 50px;
            transform: rotate(45deg);
        }
        .mouth {
            position: absolute;
            color: black;
            font-size: 80px;
            transform: rotate(135deg);
            top: 20px;
            left: 30px;
        }
    </style>
</head>
<body>
    <h1>A css gyakrolása a React nyelben</h1>
    <a href="project/dist/index.html"><p>Nyomj meg a teszhez-hez.</p></a> <br>
    <a href="https://github.com/JaniGITJANIKA/terraproject4"><p>Nyomj meg a Respository-hoz.</p></a>
    <br>
    <div class="smile">
        <div class="eyes">..</div>
        <div class="mouth">)</div>
    </div>
</body>
</html>
